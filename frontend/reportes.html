<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seleccionar Territorio</title>
  <!-- Preconnect para Inter (carga anticipada) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container flex items-center justify-center" style="min-height: 100vh; padding: var(--space-lg);">
    <div class="card" style="width: 100%; max-width: 700px;">

      <div class="card__header text-center">
        <div class="flex justify-center mb-md">
          <div class="bg-accent p-md rounded-lg">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
              <path d="M2 17L12 22L22 17" stroke="white" stroke-width="2" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>
        <h2 class="text-xl font-semibold text-primary mb-xs">Seleccionar Territorio</h2>
        <p class="text-sm text-secondary">Elige el barrio que deseas informar para registrar un reporte</p>
      </div>
      
      <div class="card__body">
        <div id="barrios-grid-informar" class="barrios-container">
          <!-- Se puebla dinámicamente en main.js -->
        </div>
        
        <div class="flex gap-md mt-lg" style="max-width: 200px; margin: 0 auto;">
          <button type="button" id="btn-volver-home" class="btn btn--secondary flex-1">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 9L12 2L21 9V20C21 20.5304 20.7893 21.0391 20.4142 21.4142C20.0391 21.7893 19.5304 22 19 22H5C4.46957 22 3.96086 21.7893 3.58579 21.4142C3.21071 21.0391 3 20.5304 3 20V9Z" stroke="currentColor" stroke-width="2"/>
              <polyline points="9,22 9,12 15,12 15,22" stroke="currentColor" stroke-width="2"/>
            </svg>
            Volver
          </button>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Scripts -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
