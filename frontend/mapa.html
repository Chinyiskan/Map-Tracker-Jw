<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seleccionar Manzanas</title>
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container" style="padding: var(--space-md); max-width: 100%;">

    <!-- Header -->
    <div class="text-center mb-md">
      <h2 id="titulo-barrio" class="text-xl font-semibold text-primary mb-xs">Mapa Territorial</h2>
    </div>

    <!-- 1. Leyenda con Colores Más Saturados -->
    <div class="flex justify-center gap-md mb-sm" style="font-size: var(--font-size-xs);">
      <div class="flex items-center gap-xs">
        <div style="width: 14px; height: 14px; background: rgba(255, 77, 77, 0.65); border: 2px solid rgba(255, 77, 77, 0.9); border-radius: 2px;"></div>
        <span>Pendiente</span>
      </div>
      <div class="flex items-center gap-xs">
        <div style="width: 14px; height: 14px; background: rgba(39, 174, 96, 0.65); border: 2px solid rgba(39, 174, 96, 0.95); border-radius: 2px;"></div>
        <span>Trabajada</span>
      </div>
      <div class="flex items-center gap-xs legend-selection">
        <div style="width: 14px; height: 14px; background: rgba(41, 128, 185, 0.75); border: 2px solid rgba(41, 128, 185, 1); border-radius: 2px;"></div>
        <span>Seleccionada</span>
      </div>
      <div class="flex items-center gap-xs legend-selection">
        <div style="width: 14px; height: 14px; background: rgba(211, 84, 0, 0.75); border: 2px solid rgba(211, 84, 0, 1); border-radius: 2px;"></div>
        <span>Sel. Trabajada</span>
      </div>
    </div>

    <!-- 1.5. Progreso del Barrio -->
    <div id="barrio-progress" class="mb-sm"></div>

    <!-- 2. Mapa Interactivo -->
    <div class="card mb-md">
      <div class="card__body" style="padding: 0; position: relative;">
        <!-- Controles de Zoom -->
        <div id="zoom-controls" class="zoom-controls" style="position: absolute; top: 10px; right: 10px; z-index: 10; display: none; flex-direction: column; gap: 4px;">
          <button type="button" id="btn-zoom-in" class="btn btn--secondary" style="width: 40px; height: 40px; padding: 0; display: flex; align-items: center; justify-content: center;" title="Acercar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="M21 21l-4.35-4.35"></path>
              <line x1="11" y1="8" x2="11" y2="14"></line>
              <line x1="8" y1="11" x2="14" y2="11"></line>
            </svg>
          </button>
          <button type="button" id="btn-zoom-out" class="btn btn--secondary" style="width: 40px; height: 40px; padding: 0; display: flex; align-items: center; justify-content: center;" title="Alejar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="M21 21l-4.35-4.35"></path>
              <line x1="8" y1="11" x2="14" y2="11"></line>
            </svg>
          </button>
          <button type="button" id="btn-zoom-center" class="btn btn--secondary" style="width: 40px; height: 40px; padding: 0; display: flex; align-items: center; justify-content: center;" title="Centrar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"></circle>
              <circle cx="12" cy="12" r="1"></circle>
              <path d="M12 1v6m0 6v6"></path>
              <path d="M1 12h6m6 0h6"></path>
            </svg>
          </button>
        </div>
        
        <div id="mapa-container" class="mapa-container" style="width: 100%; height: 70vh; min-height: 400px; border-radius: var(--radius-md); background: var(--bg-elevated); display: flex; align-items: center; justify-content: center; color: var(--text-muted); overflow: hidden;">
          <div class="mapa-placeholder text-center">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" style="margin-bottom: var(--space-sm);">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
              <circle cx="12" cy="10" r="3"></circle>
            </svg>
            <p class="text-sm">Selecciona un barrio para ver el mapa</p>
          </div>
        </div>
      </div>
    </div>

    <!-- 3. Manzanas Seleccionadas -->
    <div id="lista-manzanas" class="card mb-md" style="display: none;">
      <div class="card__header">
        <h4 class="text-sm font-semibold">Manzanas Seleccionadas</h4>
      </div>
      <div class="card__body">
        <div id="manzanas-container" class="flex flex-wrap gap-xs">
          <!-- Las manzanas seleccionadas aparecerán aquí -->
        </div>
      </div>
    </div>

    <!-- Botones de Navegación -->
    <div class="flex gap-sm justify-center">
      <button type="button" id="btn-volver" class="btn btn--secondary flex-1" onclick="window.location.href='reportes.html'">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Volver
      </button>
      
      <!-- Botón para crear nuevo reporte (modo consulta) -->
      <button type="button" id="btn-crear-reporte" class="btn btn--primary flex-1" onclick="window.location.href='reportes.html'" style="display: none;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        Crear Reporte
      </button>
      
      <!-- Botón para enviar reporte (modo reporte) -->
      <button type="button" id="btn-enviar-reporte" class="btn btn--primary flex-1" style="display: none;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        Enviar Reporte
      </button>
    </div>
  </div>
  
  <!-- Scripts -->
  <!-- Manejador de errores JSON (debe cargarse primero) -->
  <script type="module" src="js/json-error-handler.js"></script>
  <script type="module" src="js/ui.js"></script>
  <script type="module" src="js/mapas.js"></script>
  
  <!-- Inicialización del MapasManager -->
  <script type="module">
    import { MapasManager } from './js/mapas.js';
    
    // Inicializar cuando el DOM esté listo
    document.addEventListener('DOMContentLoaded', () => {
      MapasManager.init();
    });
  </script>
</body>
  <script defer src="https://speed.vercel.app/insights.js"></script>
</html>
